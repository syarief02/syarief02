<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Page not found | Syarief Azman</title>
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <style>
      :root {
        --bg: #06060b;
        --text: #e8e8ef;
        --muted: #9898ab;
        --cyan: #00d4ff;
        --purple: #7b2fff;
        --border: rgba(255, 255, 255, 0.08);
      }

      @media (prefers-color-scheme: light) {
        :root {
          --bg: #f5f5fa;
          --text: #1a1a2e;
          --muted: #4a4a6a;
          --cyan: #0099cc;
          --border: rgba(0, 0, 0, 0.08);
        }
      }

      * { box-sizing: border-box; margin: 0; }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif;
        text-align: center;
      }

      .code {
        font-size: clamp(4.5rem, 18vw, 8rem);
        font-weight: 800;
        line-height: 1;
        background: linear-gradient(135deg, var(--cyan), var(--purple));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      h1 { font-size: 1.5rem; margin: 16px 0 8px; }
      p { color: var(--muted); max-width: 420px; margin: 0 auto 28px; line-height: 1.6; }

      .links { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }

      a {
        padding: 12px 22px;
        border-radius: 12px;
        border: 1px solid var(--border);
        color: var(--text);
        text-decoration: none;
        font-weight: 600;
      }

      a.primary {
        border: none;
        color: #fff;
        background: linear-gradient(135deg, var(--purple), var(--cyan));
      }

      a:focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; }
    </style>
  </head>

  <body>
    <main>
      <div class="code" aria-hidden="true">404</div>
      <h1>This page doesn't exist</h1>
      <p>The link may be outdated or mistyped. Here are some places to start instead.</p>
      <div class="links">
        <a class="primary" href="/">Back to the homepage</a>
        <a href="/#projects">Projects</a>
        <a href="/lab/">Lab Notes</a>
        <a href="/#contact">Contact</a>
      </div>
    </main>
  </body>

</html>
